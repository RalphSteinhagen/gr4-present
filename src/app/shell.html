    <title>gr4-present</title>
    <!-- A static host that cannot send COOP/COEP, GitHub Pages among them, leaves the page without
         SharedArrayBuffer and the threaded runtime never starts. This registers a service worker that re-serves
         every response with those headers and reloads once; where the headers already arrive, as from
         devtools/serve.py, it does nothing. It reads window.document.currentScript.src, so it must not be
         deferred, async or a module. -->
    <script src="coi-serviceworker.js"></script>
    <style>
      :root {
        --background: #ffffff;
        --glyph: #0c080c;
        --text: #6a6a6a;
        --track: #e4e4e4;
        --fill: #fdb342;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #000000;
          --glyph: #ffffff;
          --text: #9a9a9a;
          --track: #333333;
        }
      }

      html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--background); }
      body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--text); }

      canvas.viewer { display: block; position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--background); }

      /* geometry mirrors gr::present::LoadingScreen so the handover to the in-application screen does not jump */
      #launch {
        position: absolute; inset: 0; z-index: 2;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: var(--background);
        transition: opacity 240ms ease-out;
      }
      #launch.done { opacity: 0; pointer-events: none; }

      .logo { width: 260px; height: auto; color: var(--glyph); }

      #bars { margin-top: 48px; display: flex; flex-direction: column; gap: 11px; }
      .bar { width: 260px; height: 3px; border-radius: 1.5px; background: var(--track); overflow: hidden; }
      .bar > span { display: block; height: 100%; width: 0%; border-radius: 1.5px; background: var(--fill); transition: width 160ms linear; }

      #status { margin-top: 26px; font-size: 13px; letter-spacing: 0.02em; }
    </style>
  </head>

    <script type="text/javascript">
      // The three stages mirror gr::present::LoadStage. Only the first can be reported from here: it tracks the
      // runtime download itself, which completes before any C++ runs. The application takes over the rest.
      const STAGES = ['application', 'content', 'initialisation'];
      const launchElement = document.getElementById('launch');
      const statusElement = document.getElementById('status');

      window.gr4Present = {
        setProgress: (stage, fraction) => {
          const bar = document.getElementById('bar-' + STAGES[stage]);
          if (bar) { bar.style.width = Math.max(0, Math.min(1, fraction)) * 100 + '%'; }
        },
        setStatus: (text) => { statusElement.textContent = text; },
        dismiss: () => launchElement.classList.add('done'),
      };

      var Module = {
        canvas: document.getElementById('canvas'),
        print: (...args) => console.log(args.join(' ')),
        printErr: (...args) => console.error(args.join(' ')),
        // Emscripten reports the runtime download here; anything else is the application's own progress
        setStatus: (text) => {
          const match = /([0-9.]+)\s*\/\s*([0-9.]+)/.exec(text || '');
          if (match) {
            window.gr4Present.setProgress(0, parseFloat(match[1]) / parseFloat(match[2]));
          } else if (!text) {
            window.gr4Present.setProgress(0, 1);
          }
        },
        postRun: [() => { window.gr4Present.setProgress(0, 1); window.gr4Present.dismiss(); }],
      };

      // Reached only when both the headers and coi-serviceworker.js failed, so the threaded runtime cannot start
      // at all rather than merely losing GR4 workflows.
      if (!window.crossOriginIsolated) {
        window.gr4Present.setStatus('failed: page is not cross-origin isolated, SharedArrayBuffer is unavailable');
      }

      window.onerror = (message) => window.gr4Present.setStatus('failed: ' + message);
    </script>
