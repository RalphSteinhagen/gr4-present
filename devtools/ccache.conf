# Repository-specific ccache settings, applied automatically by cmake/Cache.cmake.
#
# This deliberately does not sit at the repository root: ccache auto-discovers any file named ccache.conf in a
# compiled file's directory hierarchy and treats it as a *directory* configuration, which rejects cache-wide options
# such as max_size and fails the compilation. Here it is out of that hierarchy and is loaded explicitly through
# CCACHE_CONFIGPATH, where every option is permitted.
#
# The dependencies (GNU Radio 4, OpenDigitizer, SDL3, ImGui) dominate the build and are identical across build
# directories and across branches, so the defaults leave most of the achievable reuse on the table.

# Keeps the working directory out of the hash. Together with CCACHE_BASEDIR (set per-invocation by Cache.cmake)
# this lets checkouts and build directories at different paths share entries: a core-only Debug build warmed in one
# build directory and repeated in another reused 26% of its compilations, and a wiped build directory in the same
# checkout went from 137 s to 21 s. ccache's file_macro sloppiness, which gnuradio4 sets, was measured on top of this
# and changed nothing at all (106/404 hits either way), so it is deliberately absent.
hash_dir = false

# FetchContent re-clones and re-stamps dependency sources on a fresh configure, which changes header mtimes without
# changing their content. Without this every clean CI job would start from an empty cache.
sloppiness = include_file_mtime,include_file_ctime,time_macros,locale,random_seed

# Key on the compiler binary's contents rather than its mtime, so a package refresh that reinstalls the same
# compiler does not invalidate everything.
compiler_check = content

# Template-heavy GR4 translation units produce large objects, and three toolchains (GCC, Clang, Emscripten) each
# keep their own copies. At 25G the cache measured 25.8/25.0 GB, i.e. permanently evicting, which reintroduces exactly
# the dependency rebuilds it exists to prevent; a full GR4 debug build is 8257 cpu-s of that.
max_size = 100G
compression = true
compression_level = 1

# Depend mode reuses the compiler's own dependency information instead of preprocessing again: markedly faster on
# the deep header trees here.
depend_mode = true
inode_cache = true
