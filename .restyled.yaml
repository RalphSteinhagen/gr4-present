# Default Restyler Configuration: https://github.com/restyled-io/restyler/blob/main/config/default.yaml
pull_requests: false
request_review: none
labels: []

comments: false

statuses:
  differences: true
  no_differences: true
  error: true

ignore_labels:
  - restyled-ignore

restylers_version: stable

restylers:
  - clang-format:
      image:
        tag: v18
  - cmake-format
  - prettier-markdown
  - prettier-yaml
  - shellcheck
  - whitespace
  - black
