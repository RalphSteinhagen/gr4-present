<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 1600 900" width="1600" height="900">
  <title>an acquisition chain revealed a stage at a time</title>
  <rect x="0" y="0" width="1600" height="900" fill="#0f0f13"/>
  <rect x="0" y="0" width="1600" height="8" fill="#F36F21"/>

  <rect id="content" data-present="markdown" x="90" y="60" width="1420" height="330" fill="none"/>

  <g fill="none" stroke="#F36F21" stroke-width="4">
    <rect id="stage-one"   data-step="1" x="110"  y="500" width="360" height="170" rx="10"/>
    <rect id="stage-two"   data-step="2" x="620"  y="500" width="360" height="170" rx="10"/>
    <rect id="stage-three" data-step="3" x="1130" y="500" width="360" height="170" rx="10"/>
  </g>
  <g fill="#F36F21">
    <path id="arrow-one" data-step="2" d="M620 585 L586 573 L586 597 Z"/>
    <path id="arrow-two" data-step="3" d="M1130 585 L1096 573 L1096 597 Z"/>
  </g>
  <g stroke="#F36F21" stroke-width="4" fill="none">
    <path id="link-one" data-step="2" d="M470 585 H590"/>
    <path id="link-two" data-step="3" d="M980 585 H1100"/>
  </g>
  <g font-family="sans-serif" font-size="34" fill="#b4b4be" text-anchor="middle">
    <text id="label-one"   data-step="1" x="290"  y="596">acquire</text>
    <text id="label-two"   data-step="2" x="800"  y="596">transform</text>
    <text id="label-three" data-step="3" x="1310" y="596">display</text>
  </g>
  <g font-family="sans-serif" font-size="20" fill="#6f6f7a" text-anchor="middle">
    <text id="note-one"   data-step="1" x="290"  y="712">picoscope, 125 MS/s</text>
    <text id="note-two"   data-step="2" x="800"  y="712">window, FFT, average</text>
    <text id="note-three" data-step="3" x="1310" y="712">spectrum, waterfall</text>
  </g>
</svg>
