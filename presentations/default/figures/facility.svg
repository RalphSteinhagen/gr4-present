<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="-450 0 3550 2600" width="3550" height="2600">
  <title>one drawing the camera moves across: injector, ring, and the experiment beneath it, turned a quarter</title>
  <rect x="-450" y="0" width="3550" height="2600" fill="#0f0f13"/>

  <!-- the beam line, drawn once across the whole world -->
  <g fill="none" stroke="#2f2f39" stroke-width="10">
    <path d="M240 420 H1180"/>
    <path d="M1600 1080 V1520"/>
  </g>
  <circle cx="1600" cy="700" r="380" fill="none" stroke="#2f2f39" stroke-width="10"/>

  <!-- injector -->
  <g id="injector-art" fill="none" stroke="#F36F21" stroke-width="5">
    <rect x="150" y="330" width="180" height="180" rx="10"/>
    <rect x="420" y="360" width="120" height="120" rx="8"/>
    <rect x="640" y="360" width="120" height="120" rx="8"/>
    <rect x="860" y="360" width="120" height="120" rx="8"/>
  </g>
  <g font-family="sans-serif" font-size="40" fill="#b4b4be">
    <text x="150" y="290">injector</text>
  </g>
  <g font-family="sans-serif" font-size="26" fill="#6f6f7a">
    <text x="150" y="560">ion source</text>
    <text x="418" y="560">RFQ</text>
    <text x="628" y="560">DTL 1</text>
    <text x="848" y="560">DTL 2</text>
  </g>

  <!-- ring -->
  <g id="ring-art" fill="none" stroke="#F36F21" stroke-width="5">
    <circle cx="1600" cy="700" r="380"/>
    <rect x="1560" y="286" width="80" height="48" rx="6"/>
    <rect x="1560" y="1066" width="80" height="48" rx="6"/>
    <rect x="1196" y="676" width="48" height="80" rx="6"/>
    <rect x="1956" y="676" width="48" height="80" rx="6"/>
  </g>
  <g font-family="sans-serif" font-size="40" fill="#b4b4be" text-anchor="middle">
    <text x="1600" y="690">synchrotron</text>
  </g>
  <g font-family="sans-serif" font-size="26" fill="#6f6f7a" text-anchor="middle">
    <text x="1600" y="740">18 T/s ramp</text>
  </g>

  <!-- experiment, beneath the ring and turned a quarter: the camera turns with it on the way -->
  <g transform="translate(1600 1750) rotate(90) translate(-2850 -700)">
    <g id="experiment-art" fill="none" stroke="#F36F21" stroke-width="5">
      <rect x="2700" y="560" width="300" height="280" rx="12"/>
      <path d="M2700 700 H2620"/>
      <circle cx="2850" cy="700" r="70"/>
    </g>
    <g font-family="sans-serif" font-size="40" fill="#b4b4be">
      <text x="2700" y="520">experiment</text>
    </g>
    <g font-family="sans-serif" font-size="26" fill="#6f6f7a">
      <text x="2700" y="890">detector and DAQ</text>
    </g>
  </g>

  <!-- the camera frames these, and the prose lands inside them -->
  <rect id="injector"   x="130"  y="250" width="870"  height="330" fill="none"/>
  <rect id="ring"       x="130"  y="240" width="1880" height="880" fill="none"/>
  <rect id="experiment" x="970"  y="1310" width="1260" height="420" fill="none"/>
  <rect id="whole"      x="40"   y="120" width="2120" height="1940" fill="none"/>
</svg>
