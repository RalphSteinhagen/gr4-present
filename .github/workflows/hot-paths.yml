name: Hot Paths

# Instructions of each bm_ benchmark (callgrind) and the release binary's size, compared with main's by GR4's hot-paths
# bot at the pinned GR4 revision (.github/actions/gr4-devtools, scoped by .github/qualitybot.conf); red when one rose by
# more than 3 %, but never required for merging (CLAUDE.md, measured quality).
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # a GR4 ref in place of the pin; empty: the GR4 pin in cmake/DependenciesSHAs.cmake
  GR4_DEVTOOLS_REF: ""

jobs:
  image:
    name: build image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      image: ${{ steps.wait.outputs.image }}
      configure: ${{ steps.wait.outputs.configure }}
    steps:
      - uses: actions/checkout@v6
      - id: wait
        uses: ./.github/actions/wait-for-image
        with:
          flavour: GCC15-Release

  hot-paths:
    name: Hot Paths
    needs: image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: ccache settings
        run: devtools/ci/ccache-env.sh >> "$GITHUB_ENV"

      - name: Configure
        run: |
          mkdir -p cmake-build-GCC15-Release/_deps && cp -a /opt/gr4-present/deps-src/. cmake-build-GCC15-Release/_deps/
          cmake --preset GCC15-Release -DGR_BUILD_PARALLEL_LEVEL=3 -DFETCHCONTENT_FULLY_DISCONNECTED=ON ${{ needs.image.outputs.configure }}

      # the benchmarks the bot measures are the ones .github/qualitybot.conf lists
      - name: Build the benchmarks and the application
        run: cmake --build cmake-build-GCC15-Release --target gr4-present $(awk -F= '/^hotPathBenchmarks/ { print $2 }' .github/qualitybot.conf)

      - uses: ./.github/actions/gr4-devtools
        with:
          ref: ${{ env.GR4_DEVTOOLS_REF }}

      - name: Hot Paths
        id: hot-paths
        run: |
          "$RUNNER_TEMP/qualitybot" hot-paths --build cmake-build-GCC15-Release --out hot-paths-report

      - name: Report Hot Paths
        if: ${{ !cancelled() && steps.hot-paths.outcome == 'success' }}
        uses: ./.gr4-devtools/.github/actions/report
        with:
          directory: hot-paths-report
          fail-on-no-go: false

  # main's figures join the history on the ci-metrics branch; the only job here that may write to the repository
  record:
    name: record the figures
    needs: [image, hot-paths]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/gr4-devtools
        with:
          ref: ${{ env.GR4_DEVTOOLS_REF }}

      - uses: actions/download-artifact@v8
        with:
          pattern: "*-report"
          path: reports

      - name: Record
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          shopt -s nullglob
          # one matching artefact unpacks into reports/ itself, several into reports/<name>/
          set -- reports/*/
          [[ -f reports/figures.csv ]] && set -- reports
          (($#)) || { echo "nothing to record"; exit 0; }
          "$RUNNER_TEMP/qualitybot" record --out "$RUNNER_TEMP/record" "$@"
