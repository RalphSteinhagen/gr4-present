name: Formatting

# Reports which files ./formatFiles.sh would change, from GR4's formatting bot at the pinned GR4 revision
# (.github/actions/gr4-devtools, scoped by .github/qualitybot.conf); red when the change touches one, never required for merging.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # a GR4 ref in place of the pin; empty: the GR4 pin in cmake/DependenciesSHAs.cmake
  GR4_DEVTOOLS_REF: ""

jobs:
  image:
    name: build image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      image: ${{ steps.wait.outputs.image }}
    steps:
      - uses: actions/checkout@v6
      - id: wait
        uses: ./.github/actions/wait-for-image
        with:
          flavour: toolchain

  formatting:
    name: Formatting
    needs: image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/gr4-devtools
        with:
          ref: ${{ env.GR4_DEVTOOLS_REF }}

      - uses: actions/cache@v5
        with:
          path: ~/.cache/gr4-formatters
          key: formatters-${{ hashFiles('formatFiles.sh') }}

      - name: Formatting
        id: formatting
        run: |
          ./formatFiles.sh --install
          "$RUNNER_TEMP/qualitybot" formatting --out formatting-report

      - name: Keep the formatting patch
        if: ${{ !cancelled() && steps.formatting.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: formatting-patch
          path: |
            formatting-report/formatting.patch
            formatting-report/formatFiles.log
          if-no-files-found: ignore

      - name: Report Formatting
        if: ${{ !cancelled() && steps.formatting.outcome == 'success' }}
        uses: ./.gr4-devtools/.github/actions/report
        with:
          directory: formatting-report
          fail-on-no-go: false

  # main's figures join the history on the ci-metrics branch; the only job here that may write to the repository
  record:
    name: record the figures
    needs: [image, formatting]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/gr4-devtools
        with:
          ref: ${{ env.GR4_DEVTOOLS_REF }}

      - uses: actions/download-artifact@v8
        with:
          pattern: "*-report"
          path: reports

      - name: Record
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          set -- reports/*
          (($#)) || { echo "nothing to record"; exit 0; }
          "$RUNNER_TEMP/qualitybot" record --out "$RUNNER_TEMP/record" "$@"
