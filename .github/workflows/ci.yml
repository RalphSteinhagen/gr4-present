name: CI

on:
  push:
    branches: [main]
    # a version tag builds both web flavours and attaches their archives to its GitHub release
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      wasmPreset:
        description: "Emscripten preset to publish on Pages (both flavours are built and released)"
        type: choice
        default: WASM-Release
        options: [WASM-Release, WASM-Minimal]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # only a pull request's run gives way to a newer one: main's and a tag's publish, and a release cancelled halfway
  # would leave its assets half uploaded
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # every job runs in a build image from ghcr, and pulling it needs a token scope that a top-level permissions block
  # would otherwise strip
  packages: read

env:
  # a flavour's own objects once saved; one entry per flavour is kept, from main only (ccache's other settings:
  # devtools/ci/ccache-env.sh, written into each job's environment from inside its container)
  OWN_CACHE_LIMIT: 1G
  # GR4's quality bots run from GR4's devtools at the pinned GR4 revision (.github/actions/gr4-devtools), scoped by
  # .github/qualitybot.conf; they post a sticky comment and a status but never gate a merge. A GR4 ref in place of the
  # pin; empty: the GR4 pin in cmake/DependenciesSHAs.cmake
  GR4_DEVTOOLS_REF: ""

jobs:
  images:
    name: build images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      repository: ${{ steps.tags.outputs.repository }}
      toolchain: ${{ steps.tags.outputs.toolchain }}
      tag: ${{ steps.tags.outputs.tag }}
      missing: ${{ steps.missing.outputs.flavours }}
      native: ${{ steps.tags.outputs.native }}
      wasm: ${{ steps.tags.outputs.wasm }}
    steps:
      - uses: actions/checkout@v6

      # Tagged by content, so an image is rebuilt exactly when one of its inputs changes: a diff-based trigger cannot
      # tell on a squashed history, and prewarming a flavour takes about an hour.
      - name: Tags
        id: tags
        env:
          PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
        run: |
          devtools/ci/image-tags.sh >> "$GITHUB_OUTPUT"
          echo "native=$(jq -c '[.[] | select(.job == "native")]' devtools/ci/flavours.json)" >> "$GITHUB_OUTPUT"
          # a pull request builds the minimal viewer only; main, a tag and a manual run build both, for the release
          echo "wasm=$(jq -c --argjson pr "$PULL_REQUEST" '[.[] | select(.job == "wasm") | select(($pr | not) or .preset == "WASM-Minimal")
            | . + {flavour: (if .preset == "WASM-Minimal" then "minimal" else "full" end)}]' devtools/ci/flavours.json)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Toolchain image
        env:
          IMAGE: ${{ steps.tags.outputs.repository }}:${{ steps.tags.outputs.toolchain }}
        run: |
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "$IMAGE exists"
          else
            docker build -f docker/Dockerfile -t "$IMAGE" docker
            docker push "$IMAGE"
          fi

      - name: Flavours without an image
        id: missing
        env:
          REPOSITORY: ${{ steps.tags.outputs.repository }}
          TAG: ${{ steps.tags.outputs.tag }}
        run: |
          missing='[]'
          while read -r flavour; do
            preset=$(jq -r .preset <<< "$flavour")
            docker manifest inspect "$REPOSITORY:$preset-$TAG" > /dev/null 2>&1 ||
              missing=$(jq -c --argjson flavour "$flavour" '. + [$flavour]' <<< "$missing")
          done < <(jq -c '.[]' devtools/ci/flavours.json)
          echo "flavours=$missing" >> "$GITHUB_OUTPUT"
          echo "flavours to prewarm: $missing"

  # Runs only when an image is missing. The build runs in `docker run` with the checkout mounted where CI's container
  # jobs find theirs, because ccache hashes absolute include paths: only then do the prewarmed objects hit later.
  dependencies:
    name: prewarm ${{ matrix.preset }}
    needs: images
    if: needs.images.outputs.missing != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.images.outputs.missing) }}
    env:
      REPOSITORY: ${{ needs.images.outputs.repository }}
      TOOLCHAIN: ${{ needs.images.outputs.repository }}:${{ needs.images.outputs.toolchain }}
      IMAGE: ${{ needs.images.outputs.repository }}:${{ matrix.preset }}-${{ needs.images.outputs.tag }}
    steps:
      - uses: actions/checkout@v6

      # a full build of every dependency, its sources and the image layer do not fit the runner's free disk otherwise
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prewarm and publish
        run: devtools/ci/prewarm-image.sh "$TOOLCHAIN" "$IMAGE" ${{ matrix.preset }} ${{ matrix.configure }}

  native:
    # the instrumented Clang build is also the Coverage bot
    name: ${{ matrix.preset == 'Clang22-Debug' && 'Coverage · Clang22-Debug' || format('native {0}', matrix.preset) }}
    needs: [images, dependencies]
    # a flavour whose prewarm failed has no image, and its job fails at the pull; the others go ahead
    if: ${{ !cancelled() && needs.images.result == 'success' }}
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.images.outputs.repository }}:${{ matrix.preset }}-${{ needs.images.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
      # only to delete this flavour's superseded own-object caches after a main build has saved its own
      actions: write
      # the Coverage bot's comment and status
      pull-requests: write
      statuses: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.images.outputs.native) }}
    env:
      PRESET: ${{ matrix.preset }}
      OWN_CACHE_KEY: own-${{ matrix.preset }}-${{ needs.images.outputs.tag }}
    steps:
      # whole history (three commits): the coverage patch needs the merge-base with main
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: ccache settings
        run: devtools/ci/ccache-env.sh >> "$GITHUB_ENV"

      # the image's sources and FetchContent stamps, at the path they were built from; configured fully disconnected,
      # nothing is fetched
      - name: Dependency sources
        run: mkdir -p "cmake-build-$PRESET/_deps" && cp -a /opt/gr4-present/deps-src/. "cmake-build-$PRESET/_deps/"

      - name: Restore this project's objects
        uses: actions/cache/restore@v5
        with:
          path: .ccache-own
          key: ${{ env.OWN_CACHE_KEY }}-${{ github.sha }}
          restore-keys: ${{ env.OWN_CACHE_KEY }}-

      # without this the statistics printed below accumulate over earlier runs and say nothing about this one
      - name: Zero the ccache statistics
        run: ccache --zero-stats

      # The presets default to 4, which suits a 31 GB developer machine but not a 16 GB runner: two runs were killed
      # with exit 137 partway through gnuradio4's GrBasicBlocks. 3 is what gnuradio4's own CI uses.
      - name: Configure
        run: cmake --preset "$PRESET" -DGR_BUILD_PARALLEL_LEVEL=3 -DFETCHCONTENT_FULLY_DISCONNECTED=ON ${{ matrix.configure }}

      - name: Build
        run: CCACHE_LOGFILE="$GITHUB_WORKSPACE/ccache.log" cmake --build "cmake-build-$PRESET"

      # nearly every dependency compile should hit the image's store; a low rate means the image no longer matches,
      # and the misses by directory say where
      - name: ccache statistics
        run: |
          ccache --show-stats --verbose
          echo "misses by directory:"
          # lines of parallel compiles interleave: an object and its result are paired by the process id in the prefix
          awk '/Object file: /{object[$2]=$NF} /Result: .*miss/{print object[$2]}' ccache.log | sort -u |
            sed -E "s|$GITHUB_WORKSPACE/cmake-build-$PRESET/||; s|/CMakeFiles/.*||" | sort | uniq -c | sort -rn | head -30

      # Saved from main only, after the build and before the tests, so a failing test does not discard a warm store;
      # the superseded entries of this flavour are deleted once the new one is in.
      - name: Trim this project's objects
        if: github.ref == 'refs/heads/main'
        run: ccache --trim-dir .ccache-own --trim-max-size "$OWN_CACHE_LIMIT" || echo "this ccache cannot trim a store"

      - name: Save this project's objects
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v5
        with:
          path: .ccache-own
          key: ${{ env.OWN_CACHE_KEY }}-${{ github.sha }}

      - name: Delete superseded caches
        if: github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const keep = `${process.env.OWN_CACHE_KEY}-${context.sha}`;
            const caches = await github.paginate(github.rest.actions.getActionsCacheList,
              { owner: context.repo.owner, repo: context.repo.repo, key: `own-${process.env.PRESET}-`, per_page: 100 });
            for (const cache of caches.filter((cache) => cache.key !== keep)) {
              await github.rest.actions.deleteActionsCacheById({ owner: context.repo.owner, repo: context.repo.repo, cache_id: cache.id });
              core.info(`deleted ${cache.key}`);
            }

      # every instrumented process writes its own profile, which the coverage report merges; the PDF export tests run the
      # viewer itself, which needs a display (the native GUI tests start their own Xvfb)
      - name: Test
        shell: bash
        run: |
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp > "$RUNNER_TEMP/xvfb.log" 2>&1 &
          display=$!
          trap 'kill "$display" 2> /dev/null || true' EXIT
          for _ in $(seq 1 50); do DISPLAY=:99 glxinfo -B > /dev/null 2>&1 && break; sleep 0.2; done
          if ! DISPLAY=:99 glxinfo -B > /dev/null 2>&1; then
            cat "$RUNNER_TEMP/xvfb.log"
            echo "::error::Xvfb :99 does not answer"
            exit 1
          fi
          DISPLAY=:99 LLVM_PROFILE_FILE="$GITHUB_WORKSPACE/coverage-profiles/%p-%m.profraw" ctest --test-dir "cmake-build-$PRESET" --output-on-failure

      # the coverage of what ran is reported even when a test failed
      - uses: ./.github/actions/gr4-devtools
        if: ${{ !cancelled() && matrix.preset == 'Clang22-Debug' }}
        with:
          ref: ${{ env.GR4_DEVTOOLS_REF }}

      - name: Coverage
        id: coverage
        if: ${{ !cancelled() && matrix.preset == 'Clang22-Debug' }}
        run: |
          "$RUNNER_TEMP/qualitybot" coverage --build "cmake-build-$PRESET" --profiles coverage-profiles --out coverage-report

      # llvm-cov's annotated sources: this run's artefact, and on main the report /metrics/coverage/ shows
      - name: Keep the coverage report
        if: ${{ !cancelled() && steps.coverage.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: coverage-report/html

      - name: Report Coverage
        if: ${{ !cancelled() && steps.coverage.outcome == 'success' }}
        uses: ./.gr4-devtools/.github/actions/report
        with:
          directory: coverage-report
          fail-on-no-go: false

      # .clang-tidy names every check it switches off with its reason or as dated debt; two jobs fit the runner's memory
      - name: clang-tidy
        if: matrix.preset == 'Clang22-Debug'
        run: >-
          grep -o '"file": *"[^"]*"' cmake-build-${{ matrix.preset }}/compile_commands.json | sed 's/"file": *"//; s/"$//' |
          grep "^$PWD/src/" | sort -u |
          xargs -P 2 -I{} clang-tidy-22 -p cmake-build-${{ matrix.preset }} --header-filter="^$PWD/src/" --quiet {}

      # the screenshot comparison writes a diff image next to each failed capture; without it a red CI run is
      # unactionable from the log alone
      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-diffs-${{ matrix.preset }}
          path: cmake-build-${{ matrix.preset }}/captures/
          if-no-files-found: ignore

  wasm:
    name: wasm ${{ matrix.preset }}
    needs: [images, dependencies]
    # a flavour whose prewarm failed has no image, and its job fails at the pull; the others go ahead
    if: ${{ !cancelled() && needs.images.result == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.images.outputs.wasm) }}
    container:
      image: ${{ needs.images.outputs.repository }}:${{ matrix.preset }}-${{ needs.images.outputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
      actions: write
      # the WASM size bot's status on main
      pull-requests: write
      statuses: write
    env:
      # pull requests get the fast path; main and a tag also build the full runtime, which needs GR4 and OpenDigitizer
      PRESET: ${{ matrix.preset }}
      OWN_CACHE_KEY: own-${{ matrix.preset }}-${{ needs.images.outputs.tag }}
    steps:
      - uses: actions/checkout@v6

      - name: ccache settings
        run: devtools/ci/ccache-env.sh >> "$GITHUB_ENV"

      - name: Dependency sources
        run: mkdir -p "cmake-build-$PRESET/_deps" && cp -a /opt/gr4-present/deps-src/. "cmake-build-$PRESET/_deps/"

      - name: Restore this project's objects
        uses: actions/cache/restore@v5
        with:
          path: .ccache-own
          key: ${{ env.OWN_CACHE_KEY }}-${{ github.sha }}
          restore-keys: ${{ env.OWN_CACHE_KEY }}-

      - name: Zero the ccache statistics
        run: ccache --zero-stats

      # EM_CACHE is the image's: the Emscripten ports (zlib, SDL3) were fetched and built when it was prewarmed
      - name: Build
        shell: bash
        run: |
          source "$EMSDK_HOME/emsdk_env.sh"
          cmake --preset "$PRESET" -DGR_BUILD_PARALLEL_LEVEL=3 -DFETCHCONTENT_FULLY_DISCONNECTED=ON ${{ matrix.configure }}
          cmake --build "cmake-build-$PRESET"

      - name: ccache statistics
        run: ccache --show-stats --verbose

      - name: Trim this project's objects
        if: github.ref == 'refs/heads/main'
        run: ccache --trim-dir .ccache-own --trim-max-size "$OWN_CACHE_LIMIT" || echo "this ccache cannot trim a store"

      - name: Save this project's objects
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v5
        with:
          path: .ccache-own
          key: ${{ env.OWN_CACHE_KEY }}-${{ github.sha }}

      - name: Delete superseded caches
        if: github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const keep = `${process.env.OWN_CACHE_KEY}-${context.sha}`;
            const caches = await github.paginate(github.rest.actions.getActionsCacheList,
              { owner: context.repo.owner, repo: context.repo.repo, key: `own-${process.env.PRESET}-`, per_page: 100 });
            for (const cache of caches.filter((cache) => cache.key !== keep)) {
              await github.rest.actions.deleteActionsCacheById({ owner: context.repo.owner, repo: context.repo.repo, cache_id: cache.id });
              core.info(`deleted ${cache.key}`);
            }

      # the size bot measures the full viewer only: two legs would race for one status and one comment
      - uses: ./.github/actions/gr4-devtools
        if: github.ref == 'refs/heads/main' && matrix.flavour == 'full'
        with:
          ref: ${{ env.GR4_DEVTOOLS_REF }}

      - name: WASM size
        id: wasm-size
        if: github.ref == 'refs/heads/main' && matrix.flavour == 'full'
        run: |
          "$RUNNER_TEMP/qualitybot" wasm-size --build "cmake-build-$PRESET" --out wasm-size-report

      - name: Report WASM size
        if: ${{ !cancelled() && steps.wasm-size.outcome == 'success' }}
        uses: ./.gr4-devtools/.github/actions/report
        with:
          directory: wasm-size-report
          fail-on-no-go: false

      # /metrics/ reads the bots' histories from ci-metrics when opened; the copies here are its fallback, one main
      # commit behind, as the bots record after this deploys
      - name: Collect the site
        run: |
          mkdir -p site/metrics/data
          cp -r "cmake-build-$PRESET/viewer-web/." site/
          cp devtools/ci/metrics.html site/metrics/index.html
          if git fetch --no-tags --depth=1 origin ci-metrics; then git archive FETCH_HEAD | tar -x -C site/metrics/data; fi
          # GitHub Pages serves Jekyll by default, which drops files beginning with an underscore
          touch site/.nojekyll

      - name: Keep the site
        uses: actions/upload-artifact@v7
        with:
          name: site-${{ matrix.preset }}
          path: site
          include-hidden-files: true

      # main's archives go to the rolling `latest` release under the version `latest`, so their addresses stay put; a
      # tag's under its own name, which must be the version CMakeLists.txt carries
      - name: Release archive
        if: github.event_name == 'push'
        shell: bash
        run: |
          source "$EMSDK_HOME/emsdk_env.sh"
          project=$(sed -nE '/^project\(/,/\)/s/.*VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt | head -n 1)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version=$GITHUB_REF_NAME
            if [[ "$version" != "v$project" ]]; then
              echo "::error::tag $version does not match the version in CMakeLists.txt, v$project"
              exit 1
            fi
          else
            version=latest
          fi
          GR4_PRESENT_BUILD="v$project, built from ${GITHUB_SHA::7} on $(date -u +%Y-%m-%d)" \
            devtools/ci/web-archive.sh "cmake-build-$PRESET" "${{ matrix.flavour }}" "$version" release

      - name: Keep the release archive
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: web-${{ matrix.flavour }}
          path: release/*.tar.gz
          if-no-files-found: error

  # main's coverage and WASM size join the history on the ci-metrics branch; the only job here that may write to it
  record:
    name: record the figures
    needs: [images, native, wasm]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.images.outputs.repository }}:${{ needs.images.outputs.toolchain }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/gr4-devtools
        with:
          ref: ${{ env.GR4_DEVTOOLS_REF }}

      - uses: actions/download-artifact@v8
        with:
          pattern: "*-report"
          path: reports

      - name: Record
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          shopt -s nullglob
          # one matching artefact unpacks into reports/ itself, several into reports/<name>/
          set -- reports/*/
          [[ -f reports/figures.csv ]] && set -- reports
          (($#)) || { echo "nothing to record"; exit 0; }
          "$RUNNER_TEMP/qualitybot" record --out "$RUNNER_TEMP/record" "$@"

  # the presenter, /metrics/ and main's coverage report under /metrics/coverage/, deployed together
  pages:
    name: deploy to GitHub Pages
    needs: [wasm, native]
    # the site is the full leg's: a failed minimal leg must not hold it back, and a failed full leg leaves no site to fetch
    if: ${{ !cancelled() && needs.wasm.result != 'skipped' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site-${{ inputs.wasmPreset || 'WASM-Release' }}
          path: site

      - name: Main's coverage report
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: coverage-html
          path: site/metrics/coverage

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4

  # Both web flavours as downloadable archives with one SHA256SUMS: a tag's onto its own GitHub release, main's onto the
  # rolling `latest` pre-release, whose tag follows main. The only job that may write releases and tags.
  release:
    name: release the web viewer
    needs: wasm
    if: ${{ !cancelled() && github.event_name == 'push' && needs.wasm.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # never two at once for one release, and never cut short: assets half replaced would break the addresses
    concurrency:
      group: release-${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: web-*
          path: release
          merge-multiple: true

      - name: Checksums
        working-directory: release
        run: |
          ls -l
          sha256sum -- *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Tag release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* --verify-tag --title "gr4-present $GITHUB_REF_NAME" \
              --notes "The web viewer, full (live GNU Radio 4 and OpenDigitizer) and minimal, to present offline or beside a deck: see README.md, 'Releases'."
          fi

      # the tag moves first, then the new assets replace the old ones under the same names, then stale names go
      - name: Rolling latest
        if: github.ref == 'refs/heads/main'
        run: |
          if gh api "repos/$GH_REPO/git/ref/tags/latest" > /dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/latest" -f sha="$GITHUB_SHA" -F force=true > /dev/null
          else
            gh api -X POST "repos/$GH_REPO/git/refs" -f ref=refs/tags/latest -f sha="$GITHUB_SHA" > /dev/null
          fi
          notes="main at ${GITHUB_SHA::7}, rebuilt on every push: gr4-present-web-full-latest.tar.gz and gr4-present-web-minimal-latest.tar.gz. For a fixed version, use a vX.Y.Z release."
          if gh release view latest > /dev/null 2>&1; then
            gh release edit latest --prerelease --title "latest (main)" --notes "$notes"
          else
            gh release create latest --prerelease --title "latest (main)" --notes "$notes"
          fi
          gh release upload latest release/* --clobber
          gh release view latest --json assets --jq '.assets[].name' | while read -r asset; do
            [[ -f "release/$asset" ]] || gh release delete-asset latest "$asset" --yes
          done
