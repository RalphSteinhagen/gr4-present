# GR4's quality bots (fair-acc/gnuradio4 devtools/qualitybot.cpp) on this tree: each key overrides GR4's value
marker             = gr4-present
author             = gr4-present metrics
namingArguments    = --root src --root test
# libclang parses two of the heaviest units within the 16 GB runner
parseJobs          = 2
codeStyleArguments = --root src/core --root src/app --root src/export --core src/core
coverageAreas      = core=src/core/ app=src/app/ export=src/export/
coverageBuild      = the instrumented Clang 22 build (`GR4_PRESENT_COVERAGE`)
coverageExcluded   = (/_deps/|/third_party/|/test/|/cmake-build|/\.gr4-devtools/)
# bumped by hand when the coverage job's instrumentation flags change
coverageMethod     = clang-22/llvm-cov-22/1
llvm               = -22
hotPathBenchmarks  = bm_Highlight bm_Markdown
hotPathBinaries    = src/app/gr4-present
# relative to the WASM-Release build tree: the module the browser loads
wasmModules        = viewer-web/index.wasm
